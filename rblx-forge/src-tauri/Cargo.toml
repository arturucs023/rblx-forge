[package]
name = "rblx-forge"
version = "0.1.0"
description = "RBLX Forge: entorno profesional de desarrollo Roblox con OpenCode como motor de IA"
authors = ["RBLX Forge"]
edition = "2024"

[lib]
name = "rblx_forge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
log = "0.4"
ureq = { version = "2", features = ["json"] }
portable-pty = "0.8"
notify = "8"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
